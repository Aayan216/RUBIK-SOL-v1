{% extends "solver/base.html" %}
{% load static %}

{% block title %}Solution - Rubik Sol AI{% endblock %}

{% block content %}
<h2 class="mb-3"><i class="fas fa-check-circle me-2"></i>Solution</h2>
<p class="text-muted" id="solve-info">Initializing solver...</p>

<div class="text-center my-4">
    <div class="move-display" id="move-display">--</div>
    <p class="mt-2" id="move-description" style="font-size: 1.1rem; color: #555;"></p>
</div>

<div class="progress mb-4" style="height: 8px;">
    <div class="progress-bar badge-accent" id="progress-bar" role="progressbar" style="width: 0%"></div>
</div>

<div class="text-center d-flex gap-3 justify-content-center">
    <button class="btn btn-outline-secondary" id="prev-btn" disabled>
        <i class="fas fa-arrow-left me-1"></i>Previous
    </button>
    <button class="btn btn-accent" id="next-btn">
        Next<i class="fas fa-arrow-right ms-1"></i>
    </button>
</div>

<div class="text-center mt-4">
    <a href="{% url 'capture' %}" class="btn btn-outline-accent">
        <i class="fas fa-redo me-1"></i>Solve Another Cube
    </a>
    <a href="{% url 'history' %}" class="btn btn-outline-secondary">
        <i class="fas fa-history me-1"></i>View History
    </a>
</div>

<script>
const COLORS = {{ colors_json|safe }};
</script>
<script src="/static/js/cube.js"></script>
<script src="/static/js/solve.js"></script>
<script>
(function() {
    var COLOR_TO_FACE = {
        white: 'U', red: 'R', green: 'F',
        yellow: 'D', orange: 'L', blue: 'B'
    };
    var MOVE_DESCRIPTIONS = {
        'U': 'Turn upper face clockwise', 'U\'': 'Turn upper face counter-clockwise', 'U2': 'Turn upper face 180 degrees',
        'R': 'Turn right face clockwise', 'R\'': 'Turn right face counter-clockwise', 'R2': 'Turn right face 180 degrees',
        'F': 'Turn front face clockwise', 'F\'': 'Turn front face counter-clockwise', 'F2': 'Turn front face 180 degrees',
        'D': 'Turn lower face clockwise', 'D\'': 'Turn lower face counter-clockwise', 'D2': 'Turn lower face 180 degrees',
        'L': 'Turn left face clockwise', 'L\'': 'Turn left face counter-clockwise', 'L2': 'Turn left face 180 degrees',
        'B': 'Turn back face clockwise', 'B\'': 'Turn back face counter-clockwise', 'B2': 'Turn back face 180 degrees'
    };

    var faceOrder = ['top', 'right', 'front', 'bottom', 'left', 'back'];

    function buildString(colors) {
        var str = '';
        faceOrder.forEach(function(face) {
            var stickers = colors[face];
            for (var i = 0; i < 9; i++) {
                str += COLOR_TO_FACE[stickers[i]] || '?';
            }
        });
        return str;
    }

    var solveInfo = document.getElementById('solve-info');
    var moveDisplay = document.getElementById('move-display');
    var moveDesc = document.getElementById('move-description');
    var progressBar = document.getElementById('progress-bar');
    var prevBtn = document.getElementById('prev-btn');
    var nextBtn = document.getElementById('next-btn');

    var moves = [];
    var currentStep = 0;

    function updateUI() {
        if (moves.length === 0) {
            moveDisplay.textContent = '--';
            moveDesc.textContent = '';
            progressBar.style.width = '0%';
            return;
        }
        moveDisplay.textContent = moves[currentStep];
        moveDesc.textContent = MOVE_DESCRIPTIONS[moves[currentStep]] || '';
        var pct = ((currentStep + 1) / moves.length) * 100;
        progressBar.style.width = pct + '%';
        progressBar.textContent = (currentStep + 1) + ' / ' + moves.length;
        prevBtn.disabled = currentStep === 0;
        nextBtn.disabled = currentStep === moves.length - 1;
    }

    prevBtn.addEventListener('click', function() {
        if (currentStep > 0) { currentStep--; updateUI(); }
    });
    nextBtn.addEventListener('click', function() {
        if (currentStep < moves.length - 1) { currentStep++; updateUI(); }
    });

    function runSolver() {
        try {
            var cubeStr = buildString(COLORS);
            var cube = Cube.fromString(cubeStr);

            solveInfo.textContent = 'Computing solution tables... (this may take a few seconds)';
            setTimeout(function() {
                try {
                    Cube.initSolver();

                    var startTime = performance.now();
                    var solution = cube.solve();
                    var elapsed = Math.round(performance.now() - startTime);

                    if (!solution || solution.trim() === '') {
                        solveInfo.textContent = 'Cube is already solved!';
                        moveDisplay.textContent = 'Solved';
                        moveDesc.textContent = 'No moves needed';
                        progressBar.style.width = '100%';
                        return;
                    }

                    moves = solution.trim().split(' ');
                    currentStep = 0;
                    solveInfo.textContent = 'Solved in ' + moves.length + ' moves (' + elapsed + 'ms)';
                    updateUI();

                    fetch('{% url "save_solve" %}', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            colors: COLORS,
                            moves: moves,
                            move_count: moves.length,
                            solve_time_ms: elapsed
                        })
                    }).catch(function() {});
                } catch (e) {
                    solveInfo.textContent = 'Solver error: ' + e.message;
                    moveDisplay.textContent = 'Error';
                    moveDesc.textContent = e.toString();
                }
            }, 50);
        } catch (e) {
            solveInfo.textContent = 'Error: ' + e.message;
            moveDisplay.textContent = 'Error';
            moveDesc.textContent = e.toString();
        }
    }

    if (typeof Cube !== 'undefined' && Cube.fromString) {
        runSolver();
    } else {
        solveInfo.textContent = 'Error: cube.js not loaded';
    }
})();
</script>
{% endblock %}
